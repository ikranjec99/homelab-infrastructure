services:
  db:
    image: postgres:18.4
    container_name: postgres
    restart: always
    shm_size: 512mb
    environment:
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Postgres}
      PGPORT: ${POSTGRES_CONTAINER_PORT:-5432}
    ports:
      - "${POSTGRES_HOST_PORT:-5400}:${POSTGRES_CONTAINER_PORT:-5432}"
    networks:
      - homelab
    volumes:
      - pgdata:${POSTGRES_DATA_DIR:-/var/lib/postgresql}

volumes:
  pgdata:

networks:
  homelab:
    driver: bridge
