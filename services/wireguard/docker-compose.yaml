services:
  wgdashboard:
    image: donaldzou/wgdashboard:latest
    restart: unless-stopped
    container_name: wireguard-dashboard
    environment:
      - tz=${TZ:-Europe/Zagreb}
    ports:
      - "${WGDASHBOARD_HTTP_PORT:-10086}:10086/tcp"
      - "${WIREGUARD_UDP_PORT:-51820}:51820/udp"
    volumes:
      - conf:/etc/wireguard
      - data:/data
    cap_add:
      - NET_ADMIN

volumes:
  conf:
  data:
