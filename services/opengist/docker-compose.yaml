services:
  opengist:
    image: ghcr.io/thomiceli/opengist:1
    container_name: opengist
    restart: unless-stopped
    ports:
      - "${OPENGIST_HTTP_PORT:-6157}:6157"
    volumes:
      - ${OPENGIST_DATA_DIR:-./data}:/opengist
    environment:
      OG_LOG_LEVEL: ${OPENGIST_LOG_LEVEL:-error}
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
